<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<!-- ===== HEAD: pengaturan dasar halaman ===== -->
<meta charset="UTF-8">
<!-- Viewport: biar Bootstrap responsive di HP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABIDD - Contact</title>

<!-- Bootstrap 5.3.3 CSS (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome: kumpulan ikon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- CSS tambahan (hanya yang gaada di Bootstrap) -->
<link rel="stylesheet" href="style.css">
<!-- Ikon di tab browser -->
<link rel="icon" href="img/logo.png">
</head>
<body>

<!-- ===== NAVBAR (menu atas) =====
     Komponen Bootstrap: navbar. ID "menuNav" harus sama dengan data-bs-target pada tombol burger. -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top">
  <div class="container">
    <!-- Logo: klik untuk kembali ke Home -->
    <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="ABIDD Logo" class="logo-img"></a>

    <!-- Tombol burger (muncul di HP) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Daftar menu. Class "active" menandai halaman yang sedang dibuka -->
    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">SERVICES</a></li>
        <li class="nav-item"><a class="nav-link" href="project.html">PROJECTS</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ===== JUDUL HALAMAN ===== -->
<section class="bg-light border-bottom py-5 mt-5">
  <div class="container text-center py-4">
    <h1 class="fw-bold">Contact <span class="text-success">Me</span></h1>
    <p class="text-muted mb-0">Hubungi via WA atau Email</p>
  </div>
</section>

<!-- ===== ISI HALAMAN: info kontak (kiri) + form (kanan) ===== -->
<section class="py-5">
  <div class="container">
    <div class="row g-4 justify-content-center">

      <!-- Kolom kiri: info kontak -->
      <div class="col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body p-4">
            <h5 class="card-title mb-4">Info Kontak</h5>
            <p class="mb-3"><i class="fa-solid fa-envelope text-success me-2"></i><span class="text-muted small">zainalabidinbasri@gmail.com</span></p>
            <p class="mb-3"><i class="fa-brands fa-whatsapp text-success me-2"></i><span class="text-muted small">Chat lewat form yang tersedia</span></p>
            <p class="mb-0"><i class="fa-solid fa-location-dot text-success me-2"></i><span class="text-muted small">Gedong Tataan, Pesawaran, Lampung</span></p>
          </div>
        </div>
      </div>

      <!-- Kolom kanan: form. ID input (waName, waEmail, dll) dipakai script.js, jangan diubah -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <form id="waForm">
              <div class="row g-3">
                <!-- Nama -->
                <div class="col-md-6">
                  <label for="waName" class="form-label small text-muted">Nama</label>
                  <input id="waName" type="text" class="form-control" placeholder="Nama Anda" required>
                </div>
                <!-- Email -->
                <div class="col-md-6">
                  <label for="waEmail" class="form-label small text-muted">Email</label>
                  <input id="waEmail" type="email" class="form-control" placeholder="email@gmail.com" required>
                </div>
                <!-- Subjek -->
                <div class="col-12">
                  <label for="waSubject" class="form-label small text-muted">Subjek</label>
                  <input id="waSubject" type="text" class="form-control" placeholder="Mau bikin website" required>
                </div>
                <!-- Pesan -->
                <div class="col-12">
                  <label for="waMessage" class="form-label small text-muted">Pesan</label>
                  <textarea id="waMessage" rows="4" class="form-control" placeholder="Tulis pesan..." required></textarea>
                </div>
                <!-- Tombol kirim: WA (submit form) dan Email (fungsi kirimEmail di script.js) -->
                <div class="col-12 d-flex gap-2">
                  <button type="submit" class="btn btn-success w-50"><i class="fa-brands fa-whatsapp me-2"></i>Kirim WA</button>
                  <button type="button" onclick="kirimEmail()" class="btn btn-outline-dark w-50"><i class="fa-solid fa-envelope me-2"></i>Kirim Email</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="border-top py-3 text-center text-muted small">© 2026 - Zainal Abidin Basri</footer>

<!-- ===== SCRIPT =====
     Bootstrap JS: wajib supaya menu burger bisa dibuka -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- JavaScript tambahan (efek ketik, tombol WA & email) -->
<script src="script.js"></script>
</body>
</html>

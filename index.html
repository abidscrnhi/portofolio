<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<!-- ===== HEAD: pengaturan dasar halaman ===== -->
<meta charset="UTF-8">
<!-- Viewport: biar Bootstrap responsive di HP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABIDD - Home</title>

<!-- Bootstrap 5.3.3 CSS (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome: kumpulan ikon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- CSS tambahan (hanya yang gaada di Bootstrap) -->
<link rel="stylesheet" href="style.css">
<!-- Ikon di tab browser -->
<link rel="icon" href="img/logo.png">
</head>
<body>

<!-- ===== NAVBAR =====
     Komponen Bootstrap: navbar. ID "menuNav" harus sama dengan data-bs-target pada tombol burger. -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top">
  <div class="container">
    <!-- Logo: klik untuk kembali ke Home -->
    <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="ABIDD Logo" class="logo-img"></a>

    <!-- Tombol burger (muncul di HP) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-controls="menuNav" aria-expanded="false" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Daftar menu. Class "active" menandai halaman yang sedang dibuka -->
    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">SERVICES</a></li>
        <li class="nav-item"><a class="nav-link" href="project.html">PROJECTS</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ===== HERO (bagian utama halaman Home) =====
     min-vh-100 = tinggi minimal satu layar penuh, pt-5 = jarak dari navbar -->
<section class="min-vh-100 d-flex align-items-center pt-5">
  <div class="container">
    <!-- Grid: di layar besar (lg) 2 kolom berdampingan, di HP menumpuk -->
    <div class="row align-items-center g-5">

      <!-- Kolom kiri: teks perkenalan -->
      <div class="col-lg-6 text-center text-lg-start">
        <h4 class="text-success fw-semibold">Hii, WELCOME !!</h4>
        <!-- id="typed" dipakai script.js untuk efek ketik, jangan dihapus -->
        <h1 class="display-3 fw-bold">I'M <span class="text-dark">Abidd!</span><br><span class="text-success" id="typed"></span></h1>
        <p class="mt-4 text-secondary">Saya Zainal Abidin Basri dari Gedong Tataan, Lampung. Fokus di Programming, Design &amp; Networking.</p>

        <!-- Tombol Download CV versi DESKTOP: d-none d-lg-inline-block = disembunyikan di HP, tampil di layar besar -->
        <a href="cv/CV-Zainal-Abidin-Basri.pdf" download class="btn btn-success btn-lg mt-3 d-none d-lg-inline-block">
          Download CV <i class="fa-solid fa-download ms-2"></i>
        </a>
      </div>

      <!-- Kolom kanan: foto -->
      <div class="col-lg-6 text-center">
        <!-- Foto bulat: img-fluid (responsive), rounded-circle (bulat), border-success (garis hijau) -->
        <img src="img/abid-foto.jpeg" alt="Foto Zainal" class="hero-photo img-fluid rounded-circle border border-3 border-success shadow">

        <!-- Tombol Download CV versi HP: d-lg-none = tampil di HP (di bawah foto), hilang di layar besar -->
        <div class="d-lg-none mt-4">
          <a href="cv/CV-Zainal-Abidin-Basri.pdf" download class="btn btn-success btn-lg">
            Download CV <i class="fa-solid fa-download ms-2"></i>
          </a>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="border-top py-3 text-center text-muted small">© 2026 Zainal Abidin Basri</footer>

<!-- ===== SCRIPT =====
     Bootstrap JS: wajib supaya menu burger bisa dibuka -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- JavaScript tambahan (efek ketik, tombol WA & email) -->
<script src="script.js"></script>
</body>
</html>
